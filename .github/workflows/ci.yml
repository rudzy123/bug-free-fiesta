name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  LOG_LEVEL: silent
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
  API_HOST: 127.0.0.1
  API_PORT: 4000
  CORS_ORIGINS: http://localhost:3000
  JSON_BODY_LIMIT: 1mb
  CORRELATION_ID_HEADER: x-correlation-id
  SHUTDOWN_TIMEOUT_MS: 1000
  WORKER_HEALTH_HOST: 127.0.0.1
  WORKER_HEALTH_PORT: 4100
  WORKER_POLL_INTERVAL_MS: 250
  DATABASE_URL: postgresql://esign:esign_dev_password@localhost:5432/esign
  AUTH_PROVIDER: local
  AUTH_LOCAL_SHARED_SECRET: local-dev-only-shared-secret
  AUTH_COOKIE_SECURE: 'false'
  OBJECT_STORAGE_ENDPOINT: http://localhost:9000
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: esign-documents
  OBJECT_STORAGE_ACCESS_KEY: esignminio
  OBJECT_STORAGE_SECRET_KEY: esignminio_dev_password
  OBJECT_STORAGE_FORCE_PATH_STYLE: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - name: Format check
        run: pnpm format:check
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Log redaction audit
        run: pnpm audit:redaction
      - name: Fetch base for release checks
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}
      - name: Release engineering checks
        run: pnpm release:check
        env:
          RELEASE_CHECK_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: pnpm commitlint:ci --from origin/${{ github.base_ref }} --to HEAD

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Unit tests with coverage
        run: pnpm test:unit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unit-coverage
          path: |
            packages/config/coverage
            packages/config/reports
            apps/api/coverage
            apps/api/reports
            apps/worker/coverage
            apps/worker/reports
          if-no-files-found: warn

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_ENV: test
      RUN_INFRA_TESTS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Start PostgreSQL and MinIO
        run: pnpm infrastructure:up
      - name: Apply migrations
        run: pnpm db:migrate:deploy
      - name: Generate Prisma client
        # Ensure src/generated exists before turbo builds/typechecks database sources
        # (generated output is gitignored and not always restored from turbo caches).
        run: pnpm db:generate
      - name: Integration tests
        run: pnpm test:integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-reports
          path: |
            apps/api/reports
            apps/worker/reports
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Production build
        run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      OBJECT_STORAGE_DRIVER: filesystem
      OBJECT_STORAGE_FS_ROOT: ${{ github.workspace }}/tmp/e2e-object-storage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Start PostgreSQL and MinIO
        run: pnpm infrastructure:up
      - name: Build API, worker, web, and workspace dependencies
        # Playwright starts API/worker via tsx; those packages import workspace
        # dist builds. `@esign/web...` alone does not build application/api/worker.
        run: pnpm --filter @esign/api... --filter @esign/worker... --filter @esign/web... build
      - name: Apply migrations and seed
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed
      - name: Prepare filesystem object storage
        run: mkdir -p "$OBJECT_STORAGE_FS_ROOT" tmp/e2e-signing-notifications
      - name: Install Playwright Chromium
        run: pnpm --filter @esign/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        # Run Playwright directly (not via turbo) so CI env is not filtered by Turbo strict mode.
        run: pnpm --filter @esign/web exec playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  prisma:
    name: prisma
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Start PostgreSQL
        run: pnpm infrastructure:up
      - name: Apply migrations
        run: pnpm db:migrate:deploy
      - name: Check schema drift against applied database
        run: pnpm db:migrate:diff

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=high

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: TruffleHog verified secret scan
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          version: 3.88.14
          extra_args: --results=verified

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build image without publishing
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: runner
          push: false
          load: true
          provenance: false
          sbom: false
          tags: esign/${{ matrix.app }}:ci
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:4000
      - name: Generate CycloneDX SBOM
        # trivy-action 0.35.0 — post March 2026 supply-chain remediation; pin SHA + fixed Trivy version.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: esign/${{ matrix.app }}:ci
          scan-type: image
          format: cyclonedx
          output: sbom-${{ matrix.app }}.cdx.json
          version: v0.69.3
          exit-code: '0'
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: esign/${{ matrix.app }}:ci
          scan-type: image
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          version: v0.69.3
          exit-code: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sbom-${{ matrix.app }}
          path: sbom-${{ matrix.app }}.cdx.json
          if-no-files-found: warn
