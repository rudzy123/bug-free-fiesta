openapi: 3.0.3
info:
  title: Electronic signature API
  version: 0.0.0
  description: >
    Public HTTP surface. Health plus account-user authentication. This document is not a
    legal or compliance statement.
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: Liveness alias
      operationId: getHealth
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/live:
    get:
      summary: Liveness
      operationId: getHealthLive
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/ready:
    get:
      summary: Readiness
      operationId: getHealthReady
      responses:
        '200':
          description: Ready to accept traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      summary: Create an account-user session
      operationId: loginAccountUser
      description: >
        Local adapter only. Production OIDC is documented in
        docs/security/authentication-setup.md. Sets HttpOnly session and CSRF cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials (same message whether or not the email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      summary: Revoke the current account session
      operationId: logoutAccountUser
      responses:
        '204':
          description: Session revoked and cookies cleared
        '401':
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/sessions/revoke:
    post:
      summary: Revoke a session owned by the current user
      operationId: revokeAccountSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionRequest'
      responses:
        '204':
          description: Session revoked
        '401':
          description: Not authenticated or session not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/me:
    get:
      summary: Current account user and server-resolved memberships
      operationId: getCurrentAccountUser
      responses:
        '200':
          description: Authenticated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccountUser'
        '401':
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /organizations/{organizationId}/me:
    get:
      summary: Organization actor context from membership
      operationId: getOrganizationActor
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Membership loaded from persistence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationActor'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: No membership in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /organizations/{organizationId}/documents:
    post:
      summary: Authorize document.write for the membership role
      operationId: authorizeDocumentWrite
      description: >
        Persistence of documents is not implemented. The route enforces
        authentication, CSRF, membership, and deny-by-default role checks.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Caller is authorized to write documents in this organization
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF rejected, wrong organization, or role denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status, service, correlationId]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        correlationId:
          type: string
    Readiness:
      type: object
      additionalProperties: false
      required: [status, service, checks, correlationId]
      properties:
        status:
          type: string
          enum: [ready]
        service:
          type: string
        checks:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]
        correlationId:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              enum:
                - validation
                - authentication
                - not_found
                - forbidden
                - conflict
                - idempotency_replay
                - payload_too_large
                - rate_limited
                - not_ready
                - external_service
                - internal
            message:
              type: string
            correlationId:
              type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, secret]
      properties:
        email:
          type: string
          format: email
        secret:
          type: string
    LoginResponse:
      type: object
      additionalProperties: false
      required: [userId, expiresAt]
      properties:
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    CurrentAccountUser:
      type: object
      additionalProperties: false
      required: [userId, displayName, memberships]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipSummary'
    MembershipSummary:
      type: object
      additionalProperties: false
      required: [membershipId, organizationId, role]
      properties:
        membershipId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member, read_only]
    OrganizationActor:
      type: object
      additionalProperties: false
      required: [userId, organizationId, membershipId, role]
      properties:
        userId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member, read_only]
    RevokeSessionRequest:
      type: object
      additionalProperties: false
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
