openapi: 3.0.3
info:
  title: Electronic signature API
  version: 0.0.0
  description: >
    Public HTTP surface. Health, account-user authentication, document ingestion,
    preparation, send, void, finalized artifact download, and the signer-facing session API.
    This document is not a legal or compliance statement.
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: Liveness alias
      operationId: getHealth
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/live:
    get:
      summary: Liveness
      operationId: getHealthLive
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/ready:
    get:
      summary: Readiness
      operationId: getHealthReady
      responses:
        '200':
          description: Ready to accept traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      summary: Create an account-user session
      operationId: loginAccountUser
      description: >
        Local adapter only. Production OIDC is documented in
        docs/security/authentication-setup.md. Sets HttpOnly session and CSRF cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials (same message whether or not the email exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      summary: Revoke the current account session
      operationId: logoutAccountUser
      responses:
        '204':
          description: Session revoked and cookies cleared
        '401':
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/sessions/revoke:
    post:
      summary: Revoke a session owned by the current user
      operationId: revokeAccountSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionRequest'
      responses:
        '204':
          description: Session revoked
        '401':
          description: Not authenticated or session not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/me:
    get:
      summary: Current account user and server-resolved memberships
      operationId: getCurrentAccountUser
      responses:
        '200':
          description: Authenticated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccountUser'
        '401':
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /organizations/{organizationId}/me:
    get:
      summary: Organization actor context from membership
      operationId: getOrganizationActor
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Membership loaded from persistence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationActor'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: No membership in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /organizations/{organizationId}/documents:
    post:
      summary: Create a draft document and a short-lived upload capability
      operationId: createDraftDocument
      description: >
        Authenticated organization members with document.write create a DRAFT
        document. Inspection starts pending. The response includes a short-lived
        upload URL and a one-time token. The token is not stored in idempotent
        replays. Object-storage keys are never returned.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Draft created with an upload capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDocumentResponse'
        '400':
          description: Invalid title, filename, or idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: CSRF rejected, wrong organization, or role denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /organizations/{organizationId}/documents/{documentId}:
    get:
      summary: Load a tenant document without object-storage keys
      operationId: getOrganizationDocument
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDocument'
        '403':
          description: No membership in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Document not in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /organizations/{organizationId}/documents/{documentId}/source:
    put:
      summary: Stream a PDF into the issued upload capability
      operationId: uploadDocumentSource
      description: >
        PDF only. The API validates declared content type, sanitized .pdf
        extension from create time, magic bytes, and DOCUMENT_MAX_UPLOAD_BYTES.
        Reverse proxies must use the same limit. Object storage also enforces
        the cap. The original filename is stored only as sanitized display metadata.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: x-upload-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Source revision stored; inspection pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDocument'
        '400':
          description: Malformed content type, extension, or magic bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Body exceeds DOCUMENT_MAX_UPLOAD_BYTES
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /organizations/{organizationId}/documents/{documentId}/previews:
    post:
      summary: Issue a short-lived preview download capability
      operationId: issueDocumentPreview
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Preview grant issued. Object keys are not included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuePreviewResponse'
  /document-previews/{grantId}:
    get:
      summary: Stream an authorized PDF preview
      operationId: streamDocumentPreview
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: x-preview-token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PDF bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Missing, unknown, or expired preview token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /organizations/{organizationId}/documents/{documentId}/signers:
    put:
      summary: Replace signers and signing mode
      operationId: replaceDocumentSigners
      description: >
        Draft or prepared documents only. Ordered mode requires consecutive
        unique routingOrder values starting at 1. Parallel mode requires every
        routingOrder to be 1. Cross-tenant membership is denied.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceSignersRequest'
      responses:
        '200':
          description: Signers replaced. May transition draft to prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDocument'
        '403':
          description: Wrong organization or role denied
        '409':
          description: Preparation is locked after send
  /organizations/{organizationId}/documents/{documentId}/fields:
    put:
      summary: Replace server-owned signature fields
      operationId: replaceDocumentFields
      description: >
        Field ids are generated by the server. Client coordinates are stored
        only after page and overlap validation. Types are signature, initials,
        date_signed, and signer_name. Sent envelopes cannot have fields moved.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceFieldsRequest'
      responses:
        '200':
          description: Fields replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDocument'
        '409':
          description: Document already sent or later
  /organizations/{organizationId}/documents/{documentId}/send:
    post:
      summary: Send a prepared document
      operationId: sendDocument
      description: >
        Transitions draft or prepared to sent. Creates one issued signing
        session per signer. Stores only token hashes. Raw tokens appear only
        in the first response and the notifier. Idempotent with Idempotency-Key.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendDocumentRequest'
      responses:
        '200':
          description: Document sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendDocumentResponse'
  /organizations/{organizationId}/documents/{documentId}/void:
    post:
      summary: Void a document that has not been finalized
      operationId: voidDocument
      description: >
        Transitions draft, prepared, sent, or in_progress to voided. Revokes
        open signing sessions. Idempotent with Idempotency-Key. Completed and
        later states cannot be voided.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      responses:
        '200':
          description: Document voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDocument'
        '409':
          description: Document cannot be voided from its current state
  /organizations/{organizationId}/documents/{documentId}/artifact:
    get:
      summary: Download the finalized PDF artifact
      operationId: downloadFinalizedArtifact
      description: >
        Authorized tenant download of the content-addressed finalized PDF.
        The stored digest is verified before bytes are returned. An append-only
        audit event is recorded. This is not a legal certificate of completion.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Finalized PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '409':
          description: Artifact is not ready
  /organizations/{organizationId}/documents/{documentId}/signers/{signerId}/sessions/rotate:
    post:
      summary: Revoke open sessions and issue a new signing token
      operationId: rotateSigningSession
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: signerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: New session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateSessionResponse'
  /organizations/{organizationId}/documents/{documentId}/sessions/{sessionId}/revoke:
    post:
      summary: Revoke an issued or active signing session
      operationId: revokeSigningSession
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revoked
  /signing/exchange:
    post:
      summary: Exchange a one-time signing token for a session cookie
      operationId: exchangeSigningToken
      description: >
        One-time exchange. Present the raw token in the JSON body (`token`) or as
        `Authorization: Bearer`. Query-string tokens are rejected (SEC-004) because
        they leak via history, Referer, and access logs. The presented token is
        hashed immediately and looked up by hash. A new HttpOnly cookie token is
        stored as a hash; the presented token cannot be replayed. Invalid, expired,
        revoked, and unknown tokens share the same 401. Signer, document, and
        organization ids in the body are not authorization evidence and are rejected.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeSigningTokenRequest'
      responses:
        '200':
          description: Cookie session issued. CSRF cookie is readable; session cookie is HttpOnly.
          headers:
            Set-Cookie:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: no-store
            Referrer-Policy:
              schema:
                type: string
                example: no-referrer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeSigningTokenResponse'
        '401':
          description: Missing, unknown, revoked, expired, or already exchanged token
        '429':
          description: Rate limited
  /signing/session:
    get:
      summary: Resolve the current signing session
      operationId: getSigningSession
      description: Identity comes from the hashed cookie or bearer token, not from path or body ids.
      security: []
      responses:
        '200':
          description: Safe session metadata without tenant internals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignerSession'
        '401':
          description: Missing, unknown, revoked, or expired token
  /signing/document:
    get:
      summary: Safe document and signer metadata
      operationId: getSigningDocument
      security: []
      responses:
        '200':
          description: Title, mode, page count, and this signer's display name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignerDocument'
        '401':
          description: Missing, unknown, revoked, or expired token
  /signing/fields:
    get:
      summary: Server-owned fields assigned to this signer
      operationId: getSigningFields
      security: []
      responses:
        '200':
          description: Geometry for this signer only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignerFields'
        '401':
          description: Missing, unknown, revoked, or expired token
  /signing/consent:
    get:
      summary: Required consent disclosure and version
      operationId: getSigningConsent
      security: []
      responses:
        '200':
          description: Current consent copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignerConsent'
        '401':
          description: Missing, unknown, revoked, or expired token
    post:
      summary: Record explicit consent
      operationId: recordSigningConsent
      description: Cookie-authenticated. Requires CSRF and an allowed Origin. copyId must match the current disclosure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordSignerConsentRequest'
      responses:
        '200':
          description: Consent recorded (idempotent per session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSignerConsentResponse'
        '401':
          description: Missing, unknown, revoked, or expired token
        '403':
          description: CSRF rejected
  /signing/previews:
    post:
      summary: Issue a short-lived document preview URL
      operationId: issueSigningPreview
      security: []
      responses:
        '201':
          description: Preview grant for this session's document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuePreviewResponse'
        '401':
          description: Missing, unknown, revoked, or expired token
  /signing/viewed:
    post:
      summary: Record that the signer viewed the document
      operationId: recordSigningViewed
      security: []
      responses:
        '200':
          description: View recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSignerViewedResponse'
        '401':
          description: Missing, unknown, revoked, or expired token
  /signing/decline:
    post:
      summary: Decline to sign
      operationId: declineToSign
      description: Optional sanitized reason (max 500 characters). Does not expose tenant internals.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclineToSignRequest'
      responses:
        '200':
          description: Signer and document marked declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclineToSignResponse'
        '401':
          description: Missing, unknown, revoked, or expired token
        '409':
          description: Signer cannot act now
  /signing/complete:
    post:
      summary: Complete signing after consent and a valid signature capture
      operationId: completeSigning
      description: >
        Cookie-authenticated. Requires CSRF, an allowed Origin, and Idempotency-Key.
        Field ids must be this signer's server-owned fields. PNG ink is validated at the API;
        PDF flattening runs asynchronously in the worker. Does not accept client coordinates.
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSigningRequest'
      responses:
        '200':
          description: Signer completed; flattening is queued. pending means other signers remain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteSigningResponse'
        '401':
          description: Missing, unknown, revoked, or expired token
        '403':
          description: CSRF rejected
        '409':
          description: Signer cannot act now, or idempotency key reused with a different body
components:
  schemas:
    Liveness:
      type: object
      additionalProperties: false
      required: [status, service, correlationId]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        correlationId:
          type: string
    Readiness:
      type: object
      additionalProperties: false
      required: [status, service, checks, correlationId]
      properties:
        status:
          type: string
          enum: [ready]
        service:
          type: string
        checks:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              type: string
              enum: [up, down]
        correlationId:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              enum:
                - validation
                - authentication
                - not_found
                - forbidden
                - conflict
                - idempotency_replay
                - payload_too_large
                - rate_limited
                - not_ready
                - external_service
                - internal
            message:
              type: string
            correlationId:
              type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, secret]
      properties:
        email:
          type: string
          format: email
        secret:
          type: string
    LoginResponse:
      type: object
      additionalProperties: false
      required: [userId, expiresAt]
      properties:
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    CurrentAccountUser:
      type: object
      additionalProperties: false
      required: [userId, displayName, memberships]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipSummary'
    MembershipSummary:
      type: object
      additionalProperties: false
      required: [membershipId, organizationId, role]
      properties:
        membershipId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member, read_only]
    OrganizationActor:
      type: object
      additionalProperties: false
      required: [userId, organizationId, membershipId, role]
      properties:
        userId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member, read_only]
    RevokeSessionRequest:
      type: object
      additionalProperties: false
      required: [sessionId]
      properties:
        sessionId:
          type: string
          format: uuid
    CreateDocumentRequest:
      type: object
      additionalProperties: false
      required: [title, filename]
      properties:
        title:
          type: string
        filename:
          type: string
          description: Untrusted. Stored only after sanitization as display metadata.
    PublicDocument:
      type: object
      additionalProperties: false
      required:
        [
          documentId,
          title,
          state,
          inspectionStatus,
          displayName,
          availableForSigning,
          currentRevision,
          signingMode,
          signers,
          fields,
        ]
      properties:
        documentId:
          type: string
          format: uuid
        title:
          type: string
        state:
          type: string
        inspectionStatus:
          type: string
          enum: [pending, accepted, rejected]
        displayName:
          type: string
          nullable: true
        availableForSigning:
          type: boolean
        currentRevision:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PublicDocumentRevision'
        signingMode:
          type: string
          enum: [ordered, parallel]
        signers:
          type: array
          items:
            $ref: '#/components/schemas/PublicSigner'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/PublicSignatureField'
    PublicDocumentRevision:
      type: object
      additionalProperties: false
      required: [revisionId, contentType, sizeBytes, sha256Digest, displayName, pageCount]
      properties:
        revisionId:
          type: string
          format: uuid
        contentType:
          type: string
