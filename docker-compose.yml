name: esign-local

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-esign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esign_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-esign}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-esign} -d ${POSTGRES_DB:-esign}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-esignminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-esignminio_dev_password}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-esignminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-esignminio_dev_password}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-esign-documents}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$OBJECT_STORAGE_BUCKET"
        mc anonymous set none "local/$$OBJECT_STORAGE_BUCKET"
    restart: on-failure

volumes:
  postgres_data:
  minio_data:
